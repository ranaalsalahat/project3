services:

  postgres:
    image: postgres:16
    container_name: skills-postgres
    environment:
      POSTGRES_DB: course_recommendation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_recommendation_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skills-network

  backend:
    build:
      context: ./backend
    container_name: skills-backend
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root-token
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    expose:
      - "5000"
    networks:
      - skills-network

  frontend:
    build:
      context: ./frontend
    container_name: skills-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - skills-network

  vault:
    image: hashicorp/vault:1.17
    container_name: skills-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    ports:
      - "8200:8200"
    networks:
      - skills-network

volumes:
  postgres_data:

networks:
  skills-network:
    driver: bridge
