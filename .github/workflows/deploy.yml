name: SkillMatch CI/CD Security

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: skillmatch-production
  cancel-in-progress: false

jobs:
  security-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Check Docker Compose
        run: docker compose version

      - name: Verify Compose configuration
        run: docker compose config -q

      - name: Scan source with Trivy
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            echo "Trivy is not installed on the runner."
            exit 1
          fi

          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

      - name: Build application images
        run: |
          docker compose build backend frontend

      - name: Scan backend image with Trivy
        run: |
          BACKEND_IMAGE=$(docker compose images -q backend)
          echo "Backend image: $BACKEND_IMAGE"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$BACKEND_IMAGE"

      - name: Scan frontend image with Trivy
        run: |
          FRONTEND_IMAGE=$(docker compose images -q frontend)
          echo "Frontend image: $FRONTEND_IMAGE"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$FRONTEND_IMAGE"

      - name: Deploy application
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for services
        run: |
          sleep 10
          docker compose ps

      - name: Check backend
        run: |
          docker compose ps backend | grep -q "Up"

      - name: Check frontend
        run: |
          curl --fail --silent --show-error \
            --max-time 10 \
            http://localhost/

      - name: Check API
        run: |
          curl --fail --silent --show-error \
            --max-time 10 \
            http://localhost/api/courses

      - name: Final container status
        run: |
          docker compose ps
