name: SkillMatch CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 1. Gitleaks - Secret Detection
      # ==========================================
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 2. TruffleHog - Secret Detection
      # ==========================================
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

      # ==========================================
      # 3. Bandit - Python Security Scan
      # ==========================================
      - name: Install Bandit
        run: |
          python3 -m venv .venv-bandit
          .venv-bandit/bin/python -m pip install --upgrade pip
          .venv-bandit/bin/pip install bandit

      - name: Bandit Python Security Scan
        run: |
          .venv-bandit/bin/bandit -r backend -f screen

      # ==========================================
      # 4. pip-audit - Dependency Security
      # ==========================================
      - name: Install pip-audit
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/python -m pip install --upgrade pip
          .venv-security/bin/pip install pip-audit

      - name: Python Dependency Security Scan
        run: |
          .venv-security/bin/pip-audit \
            -r backend/requirements.txt

      # ==========================================
      # 5. Hadolint - Dockerfile Security
      # ==========================================
      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: backend/Dockerfile

      # ==========================================
      # 6. Check Docker
      # ==========================================
      - name: Check Docker
        run: docker --version

      # ==========================================
      # 7. Check Docker Compose
      # ==========================================
      - name: Check Docker Compose
        run: docker compose version

      # ==========================================
      # 8. Validate Docker Compose
      # ==========================================
      - name: Validate Docker Compose
        run: docker compose config

      # ==========================================
      # 9. Build Backend Image
      # ==========================================
      - name: Build Backend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/project3-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/project3-backend:latest \
            ./backend


  publish-image:
    name: Publish Backend Image to GHCR
    runs-on: ubuntu-latest
    needs: security-checks

    # Only publish from main
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Login to GHCR
      # ==========================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Build and Push Image
      # ==========================================
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/project3-backend:latest
            ghcr.io/${{ github.repository_owner }}/project3-backend:${{ github.sha }}


  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish-image

    steps:

      - name: Deployment Complete
        run: |
          echo "========================================"
          echo "SkillMatch CI/CD Pipeline Completed"
          echo "========================================"
          echo "Security checks: PASSED"
          echo "Backend image: PUBLISHED"
          echo "Registry: GHCR"
          echo "Image:"
          echo "ghcr.io/${{ github.repository_owner }}/project3-backend:latest"
          echo "========================================"
