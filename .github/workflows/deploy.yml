name: SkillMatch CI/CD Security

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: skillmatch-deployment
  cancel-in-progress: false

jobs:
  security-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Check Docker Compose
        run: docker compose version

      - name: Verify Compose file
        run: docker compose config -q

      - name: Check Trivy
        run: trivy --version

      - name: Scan filesystem
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            .

      - name: Build backend image
        run: |
          docker build \
            --pull \
            -t skillmatch-backend:ci \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --pull \
            -t skillmatch-frontend:ci \
            ./frontend

      - name: Scan backend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            skillmatch-backend:ci

      - name: Scan frontend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            skillmatch-frontend:ci

      - name: Deploy
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for services
        run: |
          sleep 10
          docker compose ps

      - name: Check containers
        run: |
          docker compose ps
          test "$(docker inspect -f '{{.State.Status}}' skills-backend)" = "running"
          test "$(docker inspect -f '{{.State.Status}}' skills-frontend)" = "running"
          test "$(docker inspect -f '{{.State.Status}}' skills-postgres)" = "running"
          test "$(docker inspect -f '{{.State.Status}}' skills-vault)" = "running"

      - name: Check frontend
        run: |
          curl --fail --silent --show-error \
            --max-time 10 \
            http://localhost/

      - name: Check API
        run: |
          curl --fail --silent --show-error \
            --max-time 10 \
            http://localhost/api/courses

      - name: Final status
        run: docker compose ps
