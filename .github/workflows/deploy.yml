name: SkillMatch CI/CD Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  security:
    name: Security Checks
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Secret Scanning
      # -----------------------------
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Python Dependency Security
      # -----------------------------
      - name: Install pip-audit
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/python -m pip install --upgrade pip
          .venv-security/bin/pip install pip-audit

      - name: Python Dependency Security Scan
        run: |
          .venv-security/bin/pip-audit -r backend/requirements.txt

      # -----------------------------
      # Docker Checks
      # -----------------------------
      - name: Check Docker
        run: |
          docker --version

      - name: Check Docker Compose
        run: |
          docker compose version

      # -----------------------------
      # Docker Compose Validation
      # -----------------------------
      - name: Validate Docker Compose
        run: |
          docker compose config

      # -----------------------------
      # Build Backend Image
      # -----------------------------
      - name: Build Backend Image
        run: |
          docker compose build backend

      # -----------------------------
      # Docker Image Security Scan
      # -----------------------------
      - name: Install Trivy
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg

            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update
            sudo apt-get install -y trivy
          fi

      - name: Scan Backend Docker Image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            skills_utilization-backend

  # -----------------------------
  # Deployment
  # -----------------------------
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: security

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          docker compose up -d --build

      - name: Show Running Containers
        run: |
          docker compose ps
